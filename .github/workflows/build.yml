name: Build the apps

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # only used to attach the apps to a release on a v* tag

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-apple-silicon
            os: macos-latest          # Apple silicon (M1 and newer)
          - name: mac-intel
            os: macos-15-intel        # Intel Macs
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt pyinstaller==6.16.0

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Build
        run: |
          SEP=$(python -c "import os; print(os.pathsep)")
          pyinstaller --noconfirm --windowed --name "Couch TV Setup" \
            --osx-bundle-identifier dev.couchtv.setup \
            --add-data "couchtv_setup/web${SEP}couchtv_setup/web" \
            --collect-data certifi \
            couch-tv-setup.py

      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: |
          APP="dist/Couch TV Setup.app"
          # No Dock icon or window of its own: the setup is the browser page, and the app
          # stops by itself when Close setup is pressed or a few minutes after the page closes.
          plutil -insert LSUIElement -bool true "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          echo "PROGRAM=$APP/Contents/MacOS/Couch TV Setup" >> "$GITHUB_ENV"
          ditto -c -k --keepParent "$APP" "dist/Couch-TV-Setup-${{ matrix.name }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          # A folder with "Couch TV Setup.exe" in it (not one big .exe: those are flagged by
          # antivirus programs far more often).
          echo "PROGRAM=dist/Couch TV Setup/Couch TV Setup.exe" >> "$GITHUB_ENV"
          python -c "import shutil; shutil.make_archive('dist/Couch-TV-Setup-${{ matrix.name }}', 'zip', 'dist', 'Couch TV Setup')"

      - name: Smoke test the built app
        run: python tests/smoke.py "$PROGRAM"

      - uses: actions/upload-artifact@v4
        with:
          name: Couch-TV-Setup-${{ matrix.name }}
          path: dist/Couch-TV-Setup-${{ matrix.name }}.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" "dist/Couch-TV-Setup-${{ matrix.name }}.zip" --clobber
