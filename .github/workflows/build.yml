name: Build the apps

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

# Read-only by default. Only the release job below, which runs on v* tags, may write.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-apple-silicon
            os: macos-latest          # Apple silicon (M1 and newer)
          - name: mac-intel
            os: macos-15-intel        # Intel Macs
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"

      - name: Install
        # exact files only, each checked by its SHA-256 (see the two requirements files)
        run: pip install --require-hashes --no-deps -r requirements.txt -r requirements-build.txt

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Build
        run: |
          SEP=$(python -c "import os; print(os.pathsep)")
          pyinstaller --noconfirm --windowed --name "Couch TV Setup" \
            --osx-bundle-identifier dev.couchtv.setup \
            --add-data "couchtv_setup/web${SEP}couchtv_setup/web" \
            --collect-data certifi \
            --exclude-module cryptography \
            couch-tv-setup.py

      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: |
          APP="dist/Couch TV Setup.app"
          # No Dock icon or window of its own: the setup is the browser page, and the app
          # stops by itself when Close setup is pressed or a few minutes after the page closes.
          plutil -insert LSUIElement -bool true "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          echo "PROGRAM=$APP/Contents/MacOS/Couch TV Setup" >> "$GITHUB_ENV"
          ditto -c -k --keepParent "$APP" "dist/Couch-TV-Setup-${{ matrix.name }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          # A folder with "Couch TV Setup.exe" in it (not one big .exe: those are flagged by
          # antivirus programs far more often).
          echo "PROGRAM=dist/Couch TV Setup/Couch TV Setup.exe" >> "$GITHUB_ENV"
          python -c "import shutil; shutil.make_archive('dist/Couch-TV-Setup-${{ matrix.name }}', 'zip', 'dist', 'Couch TV Setup')"

      - name: Smoke test the built app
        run: python tests/smoke.py "$PROGRAM"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: Couch-TV-Setup-${{ matrix.name }}
          path: dist/Couch-TV-Setup-${{ matrix.name }}.zip

  release:
    # Attaches the three zips to the release, once all three built and passed their smoke test.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --clobber
